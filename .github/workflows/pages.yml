# Baut die App und veröffentlicht sie auf GitHub Pages (bei jedem Push auf main oder manuell).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run katalog
      - run: npm run build
      - run: node scripts/pruefung-check.mjs
      # GitHub Pages komprimiert selbst; vorkomprimierte Dateien und Header-Datei anderer Hoster entfernen
      - run: find dist \( -name '*.br' -o -name '*.gz' \) -delete && rm -f dist/_headers && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
