# nginx-Konfiguration für den Theorie-Trainer (statisch, Hash-Routing)
# Header entsprechen scripts/serve.mjs. Brotli-Dateien (.br) nutzt das
# Standard-Image nicht; vorkomprimierte .gz-Dateien werden per gzip_static ausgeliefert.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Datensparsam: kein Access-Log mit IP-Adressen; ggf. anpassen und in der Datenschutzerklärung nennen
  access_log off;

  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/vtt;

  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # Dateien mit Hash im Namen: dauerhaft cachen
  location ^~ /assets/     { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }
  location ^~ /data/teile/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }

  # Einstieg, Service Worker, Katalog-Index: immer neu prüfen
  location ~* \.webmanifest$ { types { application/manifest+json webmanifest; } try_files $uri =404; add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }
  location ~* (\.html|\.json|/sw\.js)$ { try_files $uri =404; add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }
  location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }

  location / { try_files $uri =404; add_header Cache-Control "public, max-age=604800" always;
    add_header Content-Security-Policy $csp always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header X-Frame-Options DENY always; }
}
